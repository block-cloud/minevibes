<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title description">
  <title id="title">Redstone dust item</title>
  <desc id="description">A glowing pile of redstone dust and a branching redstone trail displayed on a violet voxel platform.</desc>
  <defs>
    <linearGradient id="backdrop" x2="0" y2="1">
      <stop stop-color="#281043"/>
      <stop offset="1" stop-color="#10091d"/>
    </linearGradient>
