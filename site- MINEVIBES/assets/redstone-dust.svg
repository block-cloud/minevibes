      <stop offset="1" stop-color="#231237"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#a902ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6a00ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-.8" y="-.8" width="2.6" height="2.6">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
